<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts | Veeny Digital Solutions</title>
    <link rel="stylesheet" href="main styles.css">
</head>
<body>
    <header>
        <div class="logo">Veeny<span>Digital</span></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contacts.html" class="active">Contacts</a>
        </nav>
    </header>

    <main>
        <section class="contact-page">
            <h2>Contact Us</h2>
            <div class="contact-grid">
                <div class="contact-card">
                    <h3>Reach Out</h3>
                    <ul class="contact-info">
                        <li>Email: hello@veenydigital.com</li>
                        <li>Phone: +256 700 000 000</li>
                        <li>Location: Kampala, Uganda</li>
                    </ul>
                </div>

                <div class="contact-form">
                    <h3>Send a Message</h3>
                    <form>
                        <input type="text" placeholder="Your Name" aria-label="Your Name">
                        <input type="email" placeholder="Your Email" aria-label="Your Email">
                        <textarea rows="5" placeholder="Your Message" aria-label="Your Message"></textarea>
                        <button type="submit">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Veeny Digital Solutions. All Rights Reserved.</p>
    </footer>
</body>
</html>
